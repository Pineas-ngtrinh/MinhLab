# Bootstrap HTTP before issuing the certificate. Replace this file with
# nginx-minhlab.click.conf after Certbot succeeds; do not enable both files.
limit_req_zone $binary_remote_addr zone=minhlab_sensitive:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name minhlab.click www.minhlab.click;
    client_max_body_size 6m;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/print-files {
        limit_req zone=minhlab_sensitive burst=5 nodelay;
        client_max_body_size 50m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/api/(auth/|orders$|payments/declare$) {
        limit_req zone=minhlab_sensitive burst=5 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
