# Install only after Certbot issues a certificate for BOTH hostnames.
# Replace the HTTP bootstrap config at the same sites-available/minhlab path.
limit_req_zone $binary_remote_addr zone=minhlab_sensitive:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name minhlab.click www.minhlab.click;
    return 301 https://minhlab.click$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.minhlab.click;
    ssl_certificate /etc/letsencrypt/live/minhlab.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minhlab.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://minhlab.click$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name minhlab.click;
    ssl_certificate /etc/letsencrypt/live/minhlab.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minhlab.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 6m;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/print-files {
        limit_req zone=minhlab_sensitive burst=5 nodelay;
        client_max_body_size 50m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ~ ^/api/(auth/|orders$|payments/declare$) {
        limit_req zone=minhlab_sensitive burst=5 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
